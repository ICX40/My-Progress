<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Habit Tracker | Premium</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <h1 class="main-title">Elite Tracker</h1>

    <div class="auth-container" id="authContainer">
        <h2>Welcome Back</h2>
        <p class="auth-subtitle">Sign in to continue your journey</p>
        <input type="email" class="auth-input" id="emailInput" placeholder="Email Address">
        <input type="password" class="auth-input" id="passwordInput" placeholder="Password">
        <button class="auth-btn" id="loginBtn">Login</button>
        <button class="auth-btn secondary" id="registerBtn">Create Account</button>
        
        <div class="auth-divider"><span>OR</span></div>
        <button class="auth-btn google-btn" id="googleBtn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google Logo">
            Continue with Google
        </button>
    </div>

    <div class="app-container" id="appContainer">
        <div class="header-top">
            <div class="clock-container" id="liveClock"></div>
            <div class="header-actions">
                <select class="month-selector" id="monthSelect"></select>
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>
        </div>

        <div class="current-date" id="currentDateDisplay"></div>
        
        <div class="tracker-container">
            <div class="tracker-wrapper" id="trackerWrapper"></div>
        </div>

        <div class="add-habit-container">
            <input type="text" class="add-habit-input" id="newHabitInput" placeholder="Cultivate a new habit...">
            <button class="add-habit-btn" id="addHabitBtn">Initialize</button>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="script.js"></script>
</body>
</html>
